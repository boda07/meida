# Blueprint para correr a MEIDA como servidor web (PWA: web+api na mesma origem).
# Ignora o Electron (que e desktop).
#
# A INSTANCIA QUE ESTA EM PRODUCAO chama-se "meida" (https://meida.onrender.com) e
# foi criada a mao — nao por este ficheiro. Este blueprint serve para quem quiser
# a sua propria instancia.
#
# Se ja tens um servico Render, em vez de usar este ficheiro, altera apenas o
# "Start Command" dele para "npm run start:pwa" e o Build Command para
# "npm run install:all && npm run build".
services:
  - type: web
    name: meida-pwa
    runtime: node
    # instala tambem as dependencias de server/ e web/ (vite vive em web/).
    buildCommand: npm install && npm --prefix server install && npm --prefix web install && npm run build
    startCommand: npm run start:pwa
    envVars:
      - key: SERVE_WEB
        value: "1"
      # API_KEYs opcionais do TMDB/AniList/MAL — deixa em branco se nao usares.
      - key: TMDB_API_KEY
        value: ""
      - key: ANILIST_CLIENT_ID
        value: ""
      - key: ANILIST_CLIENT_SECRET
        value: ""
      - key: MAL_CLIENT_ID
        value: ""
      - key: MAL_CLIENT_SECRET
        value: ""
    disk:
      name: meida-data
      mountPath: /data
      # A pasta data/ precisa de escrita (sqlite/json + logs + caches).
envVarGroups: []
